name: Create Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g., v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Version
        id: get_version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $version = $env:GITHUB_REF -replace 'refs/tags/', ''
          } else {
            $version = "${{ github.event.inputs.version }}"
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create ZIP
        shell: pwsh
        run: |
          $zipName = "ckg-auto-chrome-extensions.zip"

          # ============================================================
          # Exclude file/folder yang tidak perlu
          # ============================================================
          $exclude = @(
              # VCS & dev
              ".git", ".github", ".vscode", ".gitignore", ".gitattributes",

              # File updater (jangan dikirim ke user)
              "update.ps1", "update.bat", "update.exe",
              "build.ps1", "build.bat", "build.exe",
              "release.ps1", "release.bat", "release.yml",
              "CKG-Updater.exe", "icon.ico",

              # Dokumen dev
              "README.md", "LICENSE", "CHANGELOG.md",

              # Artifacts
              "*.zip", "*.log", "version.txt",

              # User data
              "data", "backup", "logs", "dist", "temp", "node_modules"
          )

          $tempFolder = Join-Path $env:RUNNER_TEMP "release_temp"
          New-Item -ItemType Directory -Force -Path $tempFolder | Out-Null

          Get-ChildItem -Path . -Force | Where-Object {
              $item = $_
              -not ($exclude | Where-Object { $item.Name -like $_ })
          } | ForEach-Object {
              $destination = Join-Path $tempFolder $_.Name
              Copy-Item $_.FullName $destination -Recurse -Force
              Write-Host "  [+] $($_.Name)"
          }

          Compress-Archive -Path "$tempFolder\*" -DestinationPath $zipName -Force

          $sizeKB = [math]::Round((Get-Item $zipName).Length / 1KB, 1)
          Write-Host "ZIP created: $zipName ($sizeKB KB)"

          Remove-Item $tempFolder -Recurse -Force

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: |
            Update ${{ steps.get_version.outputs.version }}

            ## Perubahan:
            - Update terbaru
            - Perbaikan bug

            ## Cara Update:
            1. Download file ZIP
            2. Extract ke folder extension
            3. Reload extension di Chrome
          files: |
            ckg-auto-chrome-extensions.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}