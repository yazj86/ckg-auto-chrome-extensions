name: Create Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g., v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write   # Wajib agar bisa membuat release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Version
        id: get_version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $version = $env:GITHUB_REF -replace 'refs/tags/', ''
          } else {
            $version = "${{ github.event.inputs.version }}"
          }
          # Simpan output ke GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create ZIP
        shell: pwsh
        run: |
          $zipName = "ckg-auto-chrome-extensions.zip"

          # Exclude files yang tidak perlu
          $exclude = @(".git", ".github", "*.zip", "*.log")

          # Gunakan folder temporary di luar direktori kerja (misal RUNNER_TEMP)
          $tempFolder = Join-Path $env:RUNNER_TEMP "release_temp"
          New-Item -ItemType Directory -Force -Path $tempFolder | Out-Null

          # Copy file yang diperlukan ke folder temp
          Get-ChildItem -Path . -Force | Where-Object {
            $item = $_
            -not ($exclude | Where-Object { $item.Name -like $_ })
          } | ForEach-Object {
            $destination = Join-Path $tempFolder $_.Name
            Copy-Item $_.FullName $destination -Recurse -Force
          }

          # Create ZIP dari isi folder temp
          Compress-Archive -Path "$tempFolder\*" -DestinationPath $zipName -Force

          # Cleanup
          Remove-Item $tempFolder -Recurse -Force

          Write-Host "ZIP created: $zipName"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: |
            Update ${{ steps.get_version.outputs.version }}

            ## Perubahan:
            - Update terbaru
            - Perbaikan bug

            ## Cara Update:
            1. Download file ZIP
            2. Extract ke folder extension
            3. Reload extension di Chrome
          files: |
            ckg-auto-chrome-extensions.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Opsional: untuk menghindari peringatan Node 20 deprecated
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
